[package]
name = "graft"
version = "0.1.0"
edition = "2021"
authors = ["Graft Contributors <agent@graft.dev>"]
description = "Graft: Open-Source Virtualized Source Control for AI Agents & Monorepos"
license = "Apache-2.0 OR MIT"

[features]
default = ["fuse"]
fuse = ["dep:fuser"]

[dependencies]
# Content hashing
blake3 = "1.5"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# CLI interface
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization & Protobuf
prost = "0.13"
bytes = "1.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fast Content-Defined Chunking for large files
fastcdc = "3.1"

# FUSE integration (optional feature)
fuser = { version = "0.14", default-features = false, optional = true }
libc = "0.2"

# Utilities
tempfile = "3.10"
hex = "0.4"
ureq = "3.5.0"
url = "2.5.8"
regex = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "graft"
path = "src/main.rs"

[lib]
name = "graft"
path = "src/lib.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
